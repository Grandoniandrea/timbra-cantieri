<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timbra Cantieri</title>
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timbra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=52">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <picture><source srcset="logo-dark.png" media="(prefers-color-scheme: dark)"><img class="logo" src="logo.png" alt="GE3CO Gestione Ecologia" width="131" height="40"></picture>
      <div><h1>Timbra Cantieri</h1><button class="who" id="btnWho"></button></div>
    </div>
    <button class="icon-btn" id="btnMenu" aria-label="Menu">⋯</button>
  </header>

  <div class="demo-bar" id="demoBar" hidden></div>
  <section class="card status" id="status"></section>

  <section class="stats">
    <div class="card stat"><small>Questa settimana</small><strong id="statWeek">0 min</strong><span>da lunedì</span></div>
    <div class="card stat"><small>Questo mese</small><strong id="statMonth">0 min</strong><span id="statMonthN">0 turni</span></div>
  </section>

  <section id="interventi" hidden></section>
  <section id="plan" hidden></section>

  <section>
    <div class="sec-head">
      <div><small>DOVE LAVORI</small><h2>Cantieri</h2></div>
      <button class="btn ghost" id="btnAddSite">+ Nuovo</button>
    </div>
    <p class="note" id="sitesNote" hidden>Elenco cantieri aggiornato dal responsabile.</p>
    <div class="clients" id="clients"></div>
    <ul class="list" id="sites"></ul>
  </section>

  <section>
    <div class="sec-head">
      <div><small>ULTIME ATTIVITÀ</small><h2>Timbrature</h2></div>
    </div>
    <ul class="list" id="log"></ul>
  </section>

  <footer class="foot" id="foot">I dati restano su questo telefono. Fai un backup ogni tanto dal menu ⋯</footer>
</main>

<!-- Fogli/dialog -->
<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script src="app.js?v=52"></script>
</body>
</html>
