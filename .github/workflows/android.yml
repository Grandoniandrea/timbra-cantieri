name: App Android di prova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'style.css', 'sw.js', 'mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crea l'APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd mobile
          {
            npm install --no-audit --no-fund
            node copy-web.js
            npx cap add android
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#1b1b1a' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#1b1b1a'
            # Permessi: posizione per timbrare in sede, fotocamera per le foto degli interventi
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
            grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          } 2>&1 | tee ../build.log
      - name: Pubblica l'APK nella release android-prova
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Timbra-Cantieri-prova.apk
          gh release delete android-errore -y --cleanup-tag || true
          gh release delete android-prova -y --cleanup-tag || true
          gh release create android-prova Timbra-Cantieri-prova.apk --prerelease \
            --title "Timbra Cantieri – APK di prova" \
            --notes "App Android di prova creata automaticamente ($(date -u '+%d/%m/%Y %H:%M') UTC, commit ${GITHUB_SHA::7}). Scaricare e installare sul telefono Android."
      - name: Se qualcosa va storto, pubblica il registro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-errore -y --cleanup-tag || true
          gh release create android-errore build.log --prerelease --title "Errore nella creazione dell'APK" --notes "Registro della creazione in allegato." || true
